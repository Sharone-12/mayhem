<div class="create-world-page">
  <div class="container">
    <button class="back-btn" (click)="goBack()">
      <span class="back-arrow">&larr;</span> Back
    </button>

    <h1 class="page-title">Create World</h1>
    <p class="page-subtitle">Configure your trading arena</p>

    <div class="form-card">
      <!-- World Name -->
      <div class="form-group">
        <label class="form-label">World Name</label>
        <input
          type="text"
          class="form-input"
          [(ngModel)]="worldName"
          placeholder="Enter world name"
          maxlength="30"
        />
        <span class="char-count">{{ worldName.length }}/30</span>
      </div>

      <!-- Number of Rounds -->
      <div class="form-group">
        <label class="form-label">Number of Rounds</label>
        <div class="radio-group">
          @for (opt of roundOptions; track opt) {
            <button
              class="radio-btn"
              [class.selected]="numberOfRounds === opt"
              (click)="numberOfRounds = opt"
            >
              {{ opt }}
            </button>
          }
        </div>
      </div>

      <!-- CEO Phase Duration -->
      <div class="form-group">
        <label class="form-label">CEO Phase Duration</label>
        <div class="slider-group">
          <input
            type="range"
            class="form-slider"
            [(ngModel)]="ceoPhaseDuration"
            min="30"
            max="120"
            step="10"
          />
          <span class="slider-value">{{ ceoPhaseDuration }}s</span>
        </div>
      </div>

      <!-- Market Phase Duration -->
      <div class="form-group">
        <label class="form-label">Market Phase Duration</label>
        <div class="slider-group">
          <input
            type="range"
            class="form-slider"
            [(ngModel)]="marketPhaseDuration"
            min="60"
            max="180"
            step="10"
          />
          <span class="slider-value">{{ marketPhaseDuration }}s</span>
        </div>
      </div>

      <!-- Starting Cash -->
      <div class="form-group">
        <label class="form-label">Starting Cash</label>
        <div class="cash-display">
          <span class="currency-symbol">&#8377;</span>
          <input
            type="number"
            class="form-input cash-input"
            [(ngModel)]="startingCash"
            min="10000"
            max="10000000"
            step="10000"
          />
          <span class="formatted-cash">&#8377;{{ formattedCash }}</span>
        </div>
      </div>

      <!-- Include Real Companies -->
      <div class="form-group toggle-group">
        <label class="form-label">Include Real Companies</label>
        <label class="toggle-switch">
          <input type="checkbox" [(ngModel)]="includeRealCompanies" />
          <span class="toggle-slider"></span>
        </label>
      </div>

      <!-- Max Players -->
      <div class="form-group">
        <label class="form-label">Max Players</label>
        <select class="form-select" [(ngModel)]="maxPlayers">
          @for (opt of playerOptions; track opt) {
            <option [value]="opt">{{ opt }} players</option>
          }
        </select>
      </div>
    </div>

    <button
      class="submit-btn"
      [disabled]="!isValid || isSubmitting"
      (click)="createWorld()"
    >
      {{ isSubmitting ? 'CREATING...' : 'CREATE WORLD' }}
    </button>
  </div>
</div>
