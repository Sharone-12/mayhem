<div class="company-card" [ngClass]="priceDirection">
  <div class="card-header">
    <div class="company-info">
      <h3 class="company-name">{{ company.name }}</h3>
      <span class="sector-badge">{{ company.sector }}</span>
    </div>
  </div>

  <p class="company-tagline" *ngIf="showDetails">{{ company.tagline }}</p>

  <div class="price-section">
    <span class="stock-price" [ngClass]="priceDirection">
      {{ company.stockPrice | inrCurrency }}
    </span>
    <span class="percent-change" [ngClass]="percentChange | percentChange:'class'">
      {{ percentChange | percentChange }}
    </span>
  </div>

  <div class="details-section" *ngIf="showDetails">
    <div class="detail-row">
      <span class="detail-label">Previous Close</span>
      <span class="detail-value">{{ company.previousPrice | inrCurrency }}</span>
    </div>
    <div class="detail-row">
      <span class="detail-label">Volatility</span>
      <span class="detail-value">{{ company.volatility | percentChange }}</span>
    </div>
    <div class="detail-row">
      <span class="detail-label">Market Cap</span>
      <span class="detail-value">{{ company.marketCap | inrCurrency }}</span>
    </div>
  </div>
</div>
